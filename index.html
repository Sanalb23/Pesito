<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion | Pesito</title>
    <link rel="stylesheet" href="src/public/CSS/form-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="src/public/Icons/proevolutionsoccerlogo.ico">
</head>
<body>
    <main class="login-section">
        <div class="login-frame">
            <div class="image-frame">
                <div class="pes-logo">
                    <img src="src/public/Logos/proevolutionsoccer-fulllogo.png" alt="pes-logo-img">
                </div>
            </div>
            <form class="form-frame" id="loginForm">
                <div class="form-text">
                    <div class="form-title">
                        <h1>BIENVENIDO A <span class="form-title-color">PESITO</span></h1>
                        <p>Iniciar sesion</p>
                    </div>
                    <div class="form-information">
                        <div class="form-inputs">
                            <div class="labels-and-inputs">
                                <div class="user-mail-inputs">
                                    <label for="loginEmail">Correo electronico:</label>
                                    <input type="email" id="loginEmail" required>
                                </div>
                                <div class="user-password-inputs">
                                    <label for="loginPassword">Contraseña:</label>
                                    <input type="password" id="loginPassword" required>
                                </div>
                            </div>
                            <div class="register-option">
                                <hr>
                                <p>¿No tienes una cuenta? <a href="" id="register-form">Registrate aqui</a>.</p>
                            </div>
                        </div>
                        <div class="enter-button">
                            <input type="submit" value="Ingresar">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <section class="register-section">
                    <div class="register-frame">
            <div class="image-frame">
                <div class="pes-logo">
                    <img src="src/public/Logos/proevolutionsoccer-fulllogo.png" alt="pes-logo-img">
                </div>
            </div>
            <form class="form-frame" id="registerForm">
                <div class="form-text">
                    <div class="form-title">
                        <h1>BIENVENIDO A <span class="form-title-color">PESITO</span></h1>
                        <p>Iniciar sesion</p>
                    </div>
                    <div class="form-information">
                        <div class="form-inputs">
                            <div class="labels-and-inputs">
                                <div class="user-name-inputs">
                                    <label for="regNickname">Nombre de usuario:</label>
                                    <input type="text" id="regNickname" required>
                                </div>
                                <div class="user-mail-inputs">
                                    <label for="regEmail">Correo electronico:</label>
                                    <input type="email" id="regEmail" required>
                                </div>
                                <div class="user-password-inputs">
                                    <label for="regPassword">Contraseña:</label>
                                    <input type="password" id="regPassword" required>
                                </div>
                                <div class="verify-password-inputs">
                                    <label for="regConfirmPassword">Vuelve a ingresar la contraseña:</label>
                                    <input type="password" id="regConfirmPassword" required>
                                </div>
                            </div>
                            <div class="register-option">
                                <hr>
                                <p>¿Ya tienes una cuenta?<a href="" id="login-form"> Inicia sesion aqui.</a>.</p>
                            </div>
                        </div>
                        <div class="enter-button">
                            <input type="submit" value="Ingresar">
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="src/public/JS/transition.js"></script>
    <script src="src/public/JS/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion | Pesito</title>
    <link rel="stylesheet" href="Source/CSS/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/Source/Icons/proevolutionsoccerlogo.ico">
</head>
<body>
    <main class="login-section">
        <div class="login-frame">
            <div class="image-frame">
                <div class="pes-logo">
                    <img src="Source/Logos/Diseño sin título.png" alt="pes-logo-img">
                </div>
            </div>
            <form class="form-frame">
                <div class="form-text">
                    <div class="form-title">
                        <h1>BIENVENIDO A <span class="form-title-color">PESITO</span></h1>
                        <p>Iniciar sesion</p>
                    </div>
                    <div class="form-information">
                        <div class="form-inputs">
                            <div class="labels-and-inputs">
                                <div class="user-mail-inputs">
                                    <label for="">Correo electronico:</label>
                                    <input type="email" name="" id="">
                                </div>
                                <div class="user-password-inputs">
                                    <label for="">Contraseña:</label>
                                    <input type="password">
                                </div>
                            </div>
                            <div class="register-option">
                                <hr>
                                <p>¿No tienes una cuenta? <a href="" id="register-form">Registrate aqui</a>.</p>
                            </div>
                        </div>
                        <div class="enter-button">
                            <input type="submit" value="Ingresar">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <section class="register-section">
                    <div class="register-frame">
            <div class="image-frame">
                <div class="pes-logo">
                    <img src="Source/Logos/Diseño sin título.png" alt="pes-logo-img">
                </div>
            </div>
            <form class="form-frame">
                <div class="form-text">
                    <div class="form-title">
                        <h1>BIENVENIDO A <span class="form-title-color">PESITO</span></h1>
                        <p>Iniciar sesion</p>
                    </div>
                    <div class="form-information">
                        <div class="form-inputs">
                            <div class="labels-and-inputs">
                                <div class="user-name-inputs">
                                    <label for="">Nombre de usuario:</label>
                                    <input type="text">
                                </div>
                                <div class="user-mail-inputs">
                                    <label for="">Correo electronico:</label>
                                    <input type="email" name="" id="">
                                </div>
                                <div class="user-password-inputs">
                                    <label for="">Contraseña:</label>
                                    <input type="password">
                                </div>
                                <div class="verify-password-inputs">
                                    <label for="">Vuelve a ingresar la contraseña:</label>
                                    <input type="password">
                                </div>
                            </div>
                            <div class="register-option">
                                <hr>
                                <p>¿No tienes una cuenta? <a href="">Registrate aqui</a>.</p>
                            </div>
                        </div>
                        <div class="enter-button">
                            <input type="submit" value="Ingresar">
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="/Source/JS/transition.js"></script>
</body>
</html>
